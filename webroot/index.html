<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>亮度锁定器</title>
<style>
/* ============ 全局样式：深色 + 小米风格 ============ */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
    --bg: #0F1117;
    --card: #1A1D27;
    --card-border: #252936;
    --text: #F2F3F5;
    --text-dim: #8A8F9E;
    --accent: #3482FF;
    --accent-glow: rgba(52, 130, 255, 0.3);
    --green: #34C759;
    --red: #FF3B30;
    --orange: #FF9500;
    --radius: 16px;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "MiSans", "PingFang SC", "HarmonyOS Sans", Roboto, sans-serif;
    padding: 20px 16px 40px;
    min-height: 100vh;
}

/* ============ 顶部标题 ============ */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px 20px;
}

.header-left { display: flex; align-items: center; gap: 12px; }

.logo {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, #3482FF, #7BB2FF);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 12px var(--accent-glow);
}

.title-block h1 { font-size: 19px; font-weight: 700; letter-spacing: 0.3px; }
.title-block p { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

.daemon-badge {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(52, 199, 89, 0.12);
    color: var(--green);
    border: 1px solid rgba(52, 199, 89, 0.3);
}
.daemon-badge.off {
    background: rgba(255, 59, 48, 0.12);
    color: var(--red);
    border-color: rgba(255, 59, 48, 0.3);
}

/* ============ 主开关卡片 ============ */
.master-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 24px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: border-color 0.3s;
}

.master-card.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent-glow);
}

.master-info h2 { font-size: 17px; font-weight: 600; }
.master-info p { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.master-info p b { color: var(--accent); font-weight: 600; }

/* 开关 */
.switch {
    width: 52px; height: 30px;
    border-radius: 15px;
    background: #2A2E3A;
    position: relative;
    cursor: pointer;
    transition: background 0.3s;
    flex-shrink: 0;
}
.switch::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.3s;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(22px); }

/* ============ 状态卡片 ============ */
.status-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
}

.status-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 16px;
}

.status-card .label { font-size: 12px; color: var(--text-dim); }
.status-card .value {
    font-size: 24px;
    font-weight: 700;
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
}
.status-card .value.small { font-size: 18px; }
.status-card .sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

/* ============ 设置卡片 ============ */
.settings-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
}

.settings-card h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}
.setting-row:last-child { border-bottom: none; }

.setting-label { font-size: 14px; }
.setting-label .desc { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

/* 滑块 */
.slider-wrap { display: flex; align-items: center; gap: 12px; flex: 1; max-width: 55%; }
input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: #2A2E3A;
    outline: none;
}
input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 2px 8px var(--accent-glow);
    cursor: pointer;
}
.slider-value {
    font-size: 13px;
    color: var(--accent);
    font-weight: 600;
    min-width: 44px;
    text-align: right;
    font-variant-numeric: tabular-nums;
}

/* 检查间隔 */
.interval-group { display: flex; gap: 6px; }
.chip {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    background: #232734;
    color: var(--text-dim);
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.2s;
}
.chip.active {
    background: var(--accent-glow);
    color: var(--accent);
    border-color: var(--accent);
}

/* ============ 日志卡片 ============ */
.log-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 16px 20px;
}

.log-card h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.log-card h3 button {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 12px;
    cursor: pointer;
    padding: 4px 8px;
}

.log-content {
    background: #14161E;
    border-radius: 10px;
    padding: 12px;
    font-family: "JetBrains Mono", "Cascadia Code", monospace;
    font-size: 11px;
    line-height: 1.7;
    color: #9AA0AE;
    max-height: 160px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
}

/* ============ 说明 ============ */
.footer-note {
    margin-top: 16px;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.8;
}

/* 动画 */
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}
.loading { animation: pulse 1.2s infinite; }
</style>
</head>
<body>

<!-- ===== 顶部 ===== -->
<div class="header">
    <div class="header-left">
        <div class="logo">☀️</div>
        <div class="title-block">
            <h1>亮度锁定器</h1>
            <p>温控降亮度 · 终极对抗</p>
        </div>
    </div>
    <div class="daemon-badge" id="daemonBadge">检测中…</div>
</div>

<!-- ===== 主开关 ===== -->
<div class="master-card" id="masterCard">
    <div class="master-info">
        <h2>锁定亮度</h2>
        <p>默认关闭 · 开启后屏幕亮度被压低时自动拉回 <b id="targetDisplay">4095</b></p>
    </div>
    <div class="switch" id="masterSwitch" onclick="toggleLock()"></div>
</div>

<!-- ===== 状态 ===== -->
<div class="status-grid">
    <div class="status-card">
        <div class="label">当前亮度</div>
        <div class="value" id="curBrightness">--</div>
        <div class="sub">/ 4095 最大</div>
    </div>
    <div class="status-card">
        <div class="label">目标亮度</div>
        <div class="value small" id="targetBrightness">--</div>
        <div class="sub">守护拉回的目标值</div>
    </div>
</div>

<!-- ===== 设置 ===== -->
<div class="settings-card">
    <h3>⚙️ 设置</h3>

    <div class="setting-row">
        <div class="setting-label">
            目标亮度
            <div class="desc">被压低后拉回的亮度值</div>
        </div>
        <div class="slider-wrap">
            <input type="range" id="targetSlider" min="1000" max="4095" step="1" value="4095" oninput="onTargetChange(this.value)">
            <span class="slider-value" id="targetValue">4095</span>
        </div>
    </div>

    <div class="setting-row">
        <div class="setting-label">
            检查间隔
            <div class="desc">守护进程检测频率（越短越激进）</div>
        </div>
        <div class="interval-group">
            <div class="chip" data-interval="1" onclick="setInterval_(1)">1s</div>
            <div class="chip active" data-interval="2" onclick="setInterval_(2)">2s</div>
            <div class="chip" data-interval="5" onclick="setInterval_(5)">5s</div>
            <div class="chip" data-interval="10" onclick="setInterval_(10)">10s</div>
        </div>
    </div>
</div>

<!-- ===== 日志 ===== -->
<div class="log-card">
    <h3>
        📋 守护日志
        <button onclick="refreshLog()">🔄 刷新</button>
    </h3>
    <div class="log-content" id="logContent">加载中…</div>
</div>

<div class="footer-note">
    亮度锁定器 v1.2 · KSU 模块<br>
    默认关闭，需要时在 WebUI 开启锁定
</div>

<script type="module">
// ============================================================
// KSU WebUI JavaScript —— 通过 ksu.exec 执行 root 命令
// v1.1 修复：
//   - module 作用域函数挂到 window（否则 HTML onclick 找不到）
//   - 守护进程检测改用 pgrep -f（ps -A 进程名会截断）
//   - 配置写入值做数字校验，杜绝注入
// ============================================================

// exec 封装：调用 WebView 注入的全局 ksu 对象
function ksuExec(command) {
    return new Promise((resolve, reject) => {
        const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
        window[cbName] = (errno, stdout, stderr) => {
            delete window[cbName];
            resolve({ errno, stdout, stderr });
        };
        try {
            ksu.exec(command, '{}', cbName);
        } catch (e) {
            delete window[cbName];
            reject(e);
        }
    });
}

// 模块目录（KSU 挂载点）
const MODDIR = '/data/adb/modules/brightness_lock';
const CONFIG = MODDIR + '/config';
const BRIGHTNESS = '/sys/class/backlight/panel0-backlight/brightness';

// DOM 引用
const $ = (id) => document.getElementById(id);

// ---------- 数字校验 ----------
function safeNum(v, def) {
    const n = parseInt(v);
    return isNaN(n) ? def : n;
}

// ---------- 读取配置 ----------
async function readConfig() {
    const { stdout } = await ksuExec(`cat ${CONFIG} 2>/dev/null || echo "enabled=0 target=4095 interval=2"`);
    const cfg = {};
    stdout.split('\n').forEach(line => {
        const m = line.match(/^(\w+)=(.+)$/);
        if (m) cfg[m[1]] = m[2].trim();
    });
    return cfg;
}

// ---------- 写入配置 ----------
async function writeConfig(key, value) {
    // 值强制数字化，防止特殊字符破坏配置
    const safeValue = safeNum(value, 0);
    const { stdout } = await ksuExec(`cat ${CONFIG} 2>/dev/null`);
    let lines = stdout.split('\n').filter(l => l.trim());
    let found = false;
    lines = lines.map(l => {
        if (l.startsWith(key + '=')) { found = true; return key + '=' + safeValue; }
        return l;
    });
    if (!found) lines.push(key + '=' + safeValue);
    const content = lines.join('\n');
    // 用 base64 方式写入，完全避免特殊字符问题
    const b64 = btoa(unescape(encodeURIComponent(content)));
    await ksuExec(`echo "${b64}" | base64 -d > ${CONFIG}; chmod 644 ${CONFIG}`);
}

// ---------- 刷新所有状态 ----------
async function refreshAll() {
    // 读取配置
    const cfg = await readConfig();
    let enabled = cfg.enabled === '1';
    let target = safeNum(cfg.target, 4095);
    let interval = safeNum(cfg.interval, 2);

    // 读取当前亮度
    const cur = await ksuExec(`cat ${BRIGHTNESS} 2>/dev/null`);
    const curVal = safeNum(cur.stdout.trim(), 0);
    $('curBrightness').textContent = cur.stdout.trim() || '--';

    // 首次使用（target_set=0）：目标亮度自动跟随系统当前亮度
    if (cfg.target_set === '0' && curVal > 0) {
        target = curVal;
        await writeConfig('target', target);
        await writeConfig('target_set', '1');
        // 重新读取配置（写入后）
        const cfg2 = await readConfig();
        enabled = cfg2.enabled === '1';
        interval = safeNum(cfg2.interval, 2);
    }

    // 更新 UI
    $('masterSwitch').className = enabled ? 'switch on' : 'switch';
    $('masterCard').className = enabled ? 'master-card active' : 'master-card';
    $('targetDisplay').textContent = target;
    $('targetBrightness').textContent = target;
    $('targetSlider').value = target;
    $('targetValue').textContent = target;

    document.querySelectorAll('.chip').forEach(c => {
        c.classList.toggle('active', parseInt(c.dataset.interval) === interval);
    });

    // 守护进程状态（pgrep -f 匹配完整命令行，不受进程名截断影响）
    const ps = await ksuExec(`pgrep -f "brightness_lock/daemon.sh" | head -1`);
    const running = ps.stdout.trim().length > 0;
    const badge = $('daemonBadge');
    badge.textContent = running ? '守护运行中' : '守护未运行';
    badge.className = 'daemon-badge' + (running ? '' : ' off');
}

// ---------- 开关（挂到 window 供 onclick 调用） ----------
window.toggleLock = async function() {
    const cfg = await readConfig();
    const newVal = cfg.enabled === '1' ? '0' : '1';
    await writeConfig('enabled', newVal);

    // 开启时立即生效（把亮度拉满）
    if (newVal === '1') {
        const target = safeNum(cfg.target, 4095);
        await ksuExec(`echo ${target} > ${BRIGHTNESS}`);
    }
    refreshAll();
};

// ---------- 目标亮度滑块 ----------
let targetTimer = null;
window.onTargetChange = function(value) {
    $('targetValue').textContent = value;
    clearTimeout(targetTimer);
    // 防抖：松手后 500ms 写入
    targetTimer = setTimeout(async () => {
        await writeConfig('target', value);
        // 用户手动设置后标记 target_set=1，防止下次打开被重置
        await writeConfig('target_set', '1');
        const cfg = await readConfig();
        if (cfg.enabled === '1') {
            await ksuExec(`echo ${value} > ${BRIGHTNESS}`);
        }
        refreshAll();
    }, 500);
};

// ---------- 检查间隔 ----------
window.setInterval_ = async function(sec) {
    await writeConfig('interval', sec);
    document.querySelectorAll('.chip').forEach(c => {
        c.classList.toggle('active', parseInt(c.dataset.interval) === sec);
    });
};

// ---------- 日志 ----------
window.refreshLog = async function() {
    const { stdout } = await ksuExec(`tail -20 ${MODDIR}/daemon.log 2>/dev/null`);
    $('logContent').textContent = stdout || '（暂无日志）';
    $('logContent').scrollTop = $('logContent').scrollHeight;
};

// ---------- 初始化 ----------
window.addEventListener('load', async () => {
    await refreshAll();
    await refreshLog();
    // 每 3 秒自动刷新状态
    setInterval(refreshAll, 3000);
});
</script>

</body>
</html>
